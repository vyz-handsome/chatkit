name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan project Android
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name chatkit --org com.vyz
          fi
          rm -rf test
          python3 tool/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatKit-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
