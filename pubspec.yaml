name: chatkit
description: ChatKit - simulator chat bergaya liquid glass untuk konten video.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  path: ^1.9.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  audioplayers: ^6.1.0
  record: ^6.0.0
  ffmpeg_kit_flutter_new: ^4.5.3
  gal: ^2.3.0
  share_plus: ^10.0.2
  image: ^4.2.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
